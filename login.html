<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工具授权</title><link rel="stylesheet" href="/ui.css"></head>
<body><main class="container"><h1>工具授权</h1><p>请输入此工具的授权码以继续。</p><form id="login"><label for="code">授权码</label><input id="code" class="input" type="password" required autocomplete="current-password"><button class="btn btn-primary" type="submit">登录</button><p id="error" role="alert"></p></form><a href="/">返回工具首页</a></main>
<script type="module">
const params = new URLSearchParams(location.search);
document.getElementById('login').addEventListener('submit', async event => {
  event.preventDefault();
  const error = document.getElementById('error');
  try {
    const response = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({tool: params.get('tool'), code: document.getElementById('code').value})});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '登录失败');
    const path = params.get('next') || '/';
    const target = new URL(path, location.origin);
    location.assign(path.startsWith('/') && !path.startsWith('//') && target.origin === location.origin && !path.includes('\\') ? target.href : '/');
  } catch (err) { error.textContent = err.message; }
});
</script></body></html>
