<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="批量给图片添加文字或 Logo 水印，支持满屏斜铺、九宫格定位、画布直接拖拽缩放与旋转，纯浏览器本地处理。">
  <link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.png">
  <title>图片水印 - Luyu的工具箱</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="workspace.css" />
  <script src="js/dependencies.js"></script>
  <style>
    .wm-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 24px;
      align-items: start;
    }

    .wm-card {
      background: #fff;
      border: 1px solid #e5e9e6;
      border-radius: 16px;
      padding: 20px;
    }

    .wm-dropzone {
      border: 1.5px dashed #cbd5e1;
      border-radius: 14px;
      padding: 52px 24px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .wm-dropzone:hover, .wm-dropzone.active {
      border-color: var(--tool-accent, #0ea5e9);
      background: color-mix(in srgb, var(--tool-accent, #0ea5e9) 6%, #fff);
    }
    .wm-dropzone-icon {
      display: inline-grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 15px;
      margin-bottom: 14px;
      background: linear-gradient(145deg, color-mix(in srgb, var(--tool-accent, #0ea5e9) 12%, #fff), color-mix(in srgb, var(--tool-accent, #0ea5e9) 24%, #fff));
      color: color-mix(in srgb, var(--tool-accent, #0ea5e9) 85%, #111);
    }
    .wm-dropzone-icon svg { width: 26px; height: 26px; }
    .wm-dropzone h2 { margin: 0 0 8px; font-size: 18px; color: #111; }
    .wm-dropzone p { margin: 0; font-size: 13px; color: #6b6f76; line-height: 1.7; }

    .wm-stage-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .wm-stage-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .wm-zoom-pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid #e3e7ec;
      border-radius: 999px;
      background: #f8fafc;
      padding: 2px;
      gap: 2px;
    }
    .wm-zoom-btn {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
      transition: background .15s, color .15s;
    }
    .wm-zoom-btn:hover { background: #111; color: #fff; }
    .wm-zoom-label {
      min-width: 78px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      padding: 0 6px;
      font-variant-numeric: tabular-nums;
    }
    .wm-mini-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      background: #fff;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      transition: border-color .15s, background .15s, color .15s;
    }
    .wm-mini-btn svg { width: 14px; height: 14px; }
    .wm-mini-btn:hover, .wm-mini-btn.active {
      border-color: #111;
      background: #111;
      color: #fff;
    }
    .wm-mini-btn:disabled { opacity: .45; }

    .wm-canvas-viewport {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      padding: 28px;
      border-radius: 14px;
      border: 1px solid #e5e9e6;
      background-color: #f3f4f6;
      background-image:
        linear-gradient(45deg, #e7eaef 25%, transparent 25%),
        linear-gradient(-45deg, #e7eaef 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e7eaef 75%),
        linear-gradient(-45deg, transparent 75%, #e7eaef 75%);
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0;
      overflow: hidden;
      user-select: none;
    }
    .wm-canvas-wrap {
      position: relative;
      display: inline-block;
      line-height: 0;
      max-width: 100%;
      box-shadow: 0 18px 40px -18px rgba(15, 23, 42, .35);
      border-radius: 4px;
    }
    #wm-canvas {
      display: block;
      max-width: 100%;
      max-height: 64vh;
      width: auto;
      height: auto;
      border-radius: 4px;
    }

    /* Interactive on-canvas selection & resize overlay */
    .wm-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .wm-overlay-box {
      position: absolute;
      border: 1.5px dashed color-mix(in srgb, var(--tool-accent, #0ea5e9) 88%, #111);
      border-radius: 6px;
      background: color-mix(in srgb, var(--tool-accent, #0ea5e9) 6%, transparent);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .75);
      pointer-events: auto;
      cursor: move;
      touch-action: none;
      opacity: .72;
      transition: opacity .15s, background .15s;
    }
    .wm-overlay[data-layout="tile"] .wm-overlay-box {
      cursor: default;
      opacity: .55;
    }
    .wm-overlay-box:hover, .wm-overlay-box.dragging {
      opacity: 1;
      background: color-mix(in srgb, var(--tool-accent, #0ea5e9) 10%, transparent);
    }
    .wm-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid var(--tool-accent, #0ea5e9);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .24);
      pointer-events: auto;
      touch-action: none;
      transition: transform .15s;
    }
    .wm-handle:hover { transform: scale(1.22); }
    .wm-handle[data-wm-handle="nw"] { left: -7px; top: -7px; cursor: nwse-resize; }
    .wm-handle[data-wm-handle="ne"] { right: -7px; top: -7px; cursor: nesw-resize; }
    .wm-handle[data-wm-handle="sw"] { left: -7px; bottom: -7px; cursor: nesw-resize; }
    .wm-handle[data-wm-handle="se"] { right: -7px; bottom: -7px; cursor: nwse-resize; }

    .wm-rotate-knob {
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .28);
      display: grid;
      place-items: center;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
    }
    .wm-rotate-knob::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 1.5px;
      height: 8px;
      background: var(--tool-accent, #0ea5e9);
      transform: translateX(-50%);
    }
    .wm-rotate-knob svg { width: 11px; height: 11px; }

    .wm-canvas-hint {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: #6b6f76;
    }
    .wm-preview-meta {
      font-variant-numeric: tabular-nums;
      color: #475569;
    }

    .wm-thumbs-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 10px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
    .wm-count {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 11px;
    }
    .wm-thumb-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 8px;
    }
    .wm-thumb {
      position: relative;
      flex: none;
      width: 88px;
      border-radius: 10px;
      border: 1.5px solid #e5e9e6;
      background: #fff;
      padding: 4px;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .wm-thumb:hover { transform: translateY(-1px); border-color: #94a3b8; }
    .wm-thumb.active { border-color: var(--tool-accent, #0ea5e9); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tool-accent, #0ea5e9) 18%, transparent); }
    .wm-thumb img {
      display: block;
      width: 100%;
      height: 58px;
      object-fit: cover;
      border-radius: 6px;
      background: #f1f5f9;
    }
    .wm-thumb-name {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wm-thumb-del {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .wm-thumb-del svg { width: 12px; height: 12px; }

    .wm-export-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f0f2ef;
    }
    .wm-export-bar .btn {
      flex: 1 1 160px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 42px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      padding: 0 16px;
    }
    .wm-export-bar .btn svg { width: 16px; height: 16px; }
    .wm-export-bar .btn-secondary {
      background: #fff;
      color: #111;
      border: 1.5px solid #e2e8f0;
    }
    .wm-export-bar .btn-secondary:hover:not(:disabled) { border-color: #111; }

    /* Right Controls Panel */
    .wm-controls {
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 88px;
    }
    .wm-section-title {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      color: #64748b;
    }
    .wm-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .wm-preset-btn {
      padding: 6px 11px;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      transition: all .15s;
    }
    .wm-preset-btn:hover {
      border-color: var(--tool-accent, #0ea5e9);
      background: color-mix(in srgb, var(--tool-accent, #0ea5e9) 8%, #fff);
      color: #111;
    }

    .wm-seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 3px;
      border-radius: 10px;
      background: #f1f5f9;
    }
    .wm-seg button {
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .wm-seg button.active {
      background: #fff;
      color: #111;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .wm-field { margin-bottom: 12px; }
    .wm-field:last-child { margin-bottom: 0; }
    .wm-field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
      color: #334155;
      font-weight: 500;
    }
    .wm-val {
      font-size: 12px;
      color: #64748b;
      font-variant-numeric: tabular-nums;
    }
    .wm-textarea {
      width: 100%;
      min-height: 64px;
      padding: 9px 11px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      color: #111;
      box-sizing: border-box;
    }
    .wm-textarea:focus { border-color: #111; outline: none; }
    .wm-range {
      width: 100%;
      margin: 0;
      accent-color: var(--tool-accent, #0ea5e9);
    }
    .wm-select {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 13px;
    }
    .wm-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: #334155;
    }
    .wm-checks label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .wm-color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wm-color-input {
      width: 34px;
      height: 30px;
      padding: 2px;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
    }
    .wm-swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid #cbd5e1;
      padding: 0;
      transition: transform .15s, box-shadow .15s;
    }
    .wm-swatch:hover { transform: scale(1.12); }
    .wm-swatch.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #111; }

    .wm-logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .wm-logo-preview {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      display: grid;
      place-items: center;
      padding: 4px;
    }
    .wm-logo-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .wm-grid9 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 168px;
    }
    .wm-grid9 button {
      height: 34px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 11px;
      font-weight: 600;
      transition: all .15s;
    }
    .wm-grid9 button:hover { border-color: #94a3b8; color: #111; }
    .wm-grid9 button.active {
      border-color: #111;
      background: #111;
      color: #fff;
    }

    .wm-divider {
      height: 1px;
      background: #f0f2ef;
      margin: 2px 0;
    }
    .wm-privacy {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
    }
    .wm-privacy svg { width: 15px; height: 15px; color: var(--tool-accent, #0ea5e9); }

    @media (max-width: 980px) {
      .wm-layout { grid-template-columns: 1fr; }
      .wm-controls { position: static; }
    }
  </style>
</head>
<body>
  <div id="nav-container"></div>

  <main class="container">
    <div class="wm-layout">
      <!-- Left: Upload, Interactive Preview & Batch Queue -->
      <section class="wm-card" aria-label="水印预览区">
        <div id="wm-empty">
          <div id="wm-dropzone" class="wm-dropzone" role="button" tabindex="0" aria-label="选择或拖拽图片到此处">
            <span class="wm-dropzone-icon" data-icon="watermark"></span>
            <h2>选择或拖入图片，也支持直接 Ctrl+V 粘贴截图</h2>
            <p>支持 JPG / PNG / WebP 批量处理 · 水印可在画布上直接拖拽角点放大缩小与旋转</p>
          </div>
        </div>
        <input type="file" id="wm-file-input" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />

        <div id="wm-stage" hidden>
          <div class="wm-stage-bar">
            <div class="wm-stage-group">
              <div class="wm-zoom-pill" role="group" aria-label="快速缩放水印">
                <button type="button" id="wm-zoom-out" class="wm-zoom-btn" aria-label="缩小水印" title="缩小水印">−</button>
                <span id="wm-zoom-label" class="wm-zoom-label">字号 28px</span>
                <button type="button" id="wm-zoom-in" class="wm-zoom-btn" aria-label="放大水印" title="放大水印">+</button>
              </div>
              <button type="button" id="wm-compare-btn" class="wm-mini-btn">
                <span data-icon="scale"></span>
                <span>按住对比原图</span>
              </button>
            </div>
            <div class="wm-stage-group">
              <button type="button" id="wm-add-more" class="wm-mini-btn">
                <span data-icon="upload"></span>
                <span>继续加图</span>
              </button>
              <button type="button" id="wm-clear-all" class="wm-mini-btn">
                <span data-icon="trash"></span>
                <span>清空</span>
              </button>
            </div>
          </div>

          <div class="wm-canvas-viewport">
            <div id="wm-canvas-wrap" class="wm-canvas-wrap">
              <canvas id="wm-canvas"></canvas>
              <div id="wm-overlay" class="wm-overlay" hidden>
                <div id="wm-overlay-box" class="wm-overlay-box" title="拖拽角点缩放水印，滚轮微调大小，单点模式可拖动位置">
                  <span class="wm-handle" data-wm-handle="nw" aria-label="左上角缩放"></span>
                  <span class="wm-handle" data-wm-handle="ne" aria-label="右上角缩放"></span>
                  <span class="wm-handle" data-wm-handle="sw" aria-label="左下角缩放"></span>
                  <span class="wm-handle" data-wm-handle="se" aria-label="右下角缩放"></span>
                  <span id="wm-overlay-rotate" class="wm-rotate-knob" title="拖拽旋转水印"><span data-icon="refresh"></span></span>
                </div>
              </div>
            </div>
          </div>

          <div class="wm-canvas-hint">
            <span>提示：拖拽虚线框四角直接放大/缩小水印，拖动顶部圆点旋转，或在框上滚动鼠标滚轮微调</span>
            <span id="wm-preview-meta" class="wm-preview-meta"></span>
          </div>

          <div class="wm-thumbs-head">
            <span>待处理图片<span id="wm-count-badge" class="wm-count">0</span></span>
          </div>
          <div id="wm-thumb-list" class="wm-thumb-list" aria-label="图片列表"></div>

          <div class="wm-export-bar">
            <button type="button" id="wm-download-one" class="btn btn-secondary" disabled>
              <span data-icon="download"></span>
              <span>下载当前图片</span>
            </button>
            <button type="button" id="wm-download-all" class="btn btn-primary" disabled>
              <span data-icon="package"></span>
              <span>批量导出 ZIP</span>
            </button>
          </div>
          <p id="wm-status" class="operation-status" aria-live="polite" style="margin:12px 0 0;"></p>
        </div>
      </section>

      <!-- Right: Watermark Controls -->
      <aside class="wm-card wm-controls" aria-label="水印参数设置">
        <div>
          <p class="wm-section-title">常用预设</p>
          <div class="wm-presets">
            <button type="button" class="wm-preset-btn" data-wm-preset="idcard">证件防盗斜铺</button>
            <button type="button" class="wm-preset-btn" data-wm-preset="corner">右下角落款</button>
            <button type="button" class="wm-preset-btn" data-wm-preset="dense">全屏浅色防盗</button>
          </div>
        </div>

        <div class="wm-divider"></div>

        <div>
          <p class="wm-section-title">水印类型</p>
          <div class="wm-seg" role="group" aria-label="水印类型">
            <button type="button" data-wm-mode="text" aria-pressed="true">文字水印</button>
            <button type="button" data-wm-mode="image" aria-pressed="false">图片 / Logo</button>
          </div>
        </div>

        <div id="wm-text-panel">
          <div class="wm-field">
            <div class="wm-field-row"><label for="wm-text">水印文字（支持换行）</label></div>
            <textarea id="wm-text" class="wm-textarea" placeholder="输入水印内容，例如：仅供办理业务使用"></textarea>
          </div>
          <div class="wm-field">
            <div class="wm-field-row">
              <label for="wm-font-size">文字大小</label>
              <span id="wm-font-size-val" class="wm-val">28px</span>
            </div>
            <input id="wm-font-size" class="wm-range" type="range" min="10" max="220" step="1" value="28" />
          </div>
          <div class="wm-field">
            <div class="wm-field-row"><label for="wm-font-family">字体风格</label></div>
            <select id="wm-font-family" class="wm-select">
              <option value="sans">黑体 / 无衬线</option>
              <option value="serif">宋体 / 衬线</option>
              <option value="mono">等宽字体</option>
            </select>
          </div>
          <div class="wm-field">
            <div class="wm-field-row"><label for="wm-color">文字颜色</label></div>
            <div class="wm-color-row">
              <input id="wm-color" class="wm-color-input" type="color" value="#ffffff" />
              <button type="button" class="wm-swatch" data-wm-color="#ffffff" style="background:#ffffff" aria-label="白色"></button>
              <button type="button" class="wm-swatch" data-wm-color="#111827" style="background:#111827" aria-label="深黑"></button>
              <button type="button" class="wm-swatch" data-wm-color="#64748b" style="background:#64748b" aria-label="中性灰"></button>
              <button type="button" class="wm-swatch" data-wm-color="#ef4444" style="background:#ef4444" aria-label="警示红"></button>
              <button type="button" class="wm-swatch" data-wm-color="#0ea5e9" style="background:#0ea5e9" aria-label="科技蓝"></button>
            </div>
          </div>
          <div class="wm-checks">
            <label><input type="checkbox" id="wm-bold" checked /> 加粗</label>
            <label><input type="checkbox" id="wm-stroke" checked /> 描边防融合</label>
            <label><input type="checkbox" id="wm-auto-scale" checked /> 按图宽自适应</label>
          </div>
        </div>

        <div id="wm-image-panel" hidden>
          <div class="wm-field">
            <div class="wm-field-row"><span>上传透明底 Logo（PNG / SVG / WebP）</span></div>
            <div class="wm-logo-box">
              <button type="button" id="wm-logo-btn" class="wm-mini-btn">
                <span data-icon="upload"></span>
                <span>选择 Logo 图片</span>
              </button>
              <div id="wm-logo-preview" class="wm-logo-preview" hidden></div>
              <button type="button" id="wm-logo-clear" class="wm-mini-btn" hidden>移除</button>
              <input type="file" id="wm-logo-input" accept="image/png,image/svg+xml,image/webp,image/jpeg" hidden />
            </div>
          </div>
          <div class="wm-field">
            <div class="wm-field-row">
              <label for="wm-logo-scale">Logo 大小（占图宽比例）</label>
              <span id="wm-logo-scale-val" class="wm-val">18%</span>
            </div>
            <input id="wm-logo-scale" class="wm-range" type="range" min="4" max="80" step="1" value="18" />
          </div>
        </div>

        <div class="wm-divider"></div>

        <div>
          <p class="wm-section-title">排布方式</p>
          <div class="wm-seg" role="group" aria-label="排布方式">
            <button type="button" data-wm-layout="tile" aria-pressed="true">满屏斜铺</button>
            <button type="button" data-wm-layout="single" aria-pressed="false">单点 / 九宫格</button>
          </div>
        </div>

        <div>
          <div class="wm-field">
            <div class="wm-field-row">
              <label for="wm-opacity">不透明度</label>
              <span id="wm-opacity-val" class="wm-val">38%</span>
            </div>
            <input id="wm-opacity" class="wm-range" type="range" min="5" max="100" step="1" value="38" />
          </div>
          <div class="wm-field">
            <div class="wm-field-row">
              <label for="wm-angle">旋转角度</label>
              <span id="wm-angle-val" class="wm-val">-30°</span>
            </div>
            <input id="wm-angle" class="wm-range" type="range" min="-180" max="180" step="1" value="-30" />
          </div>
        </div>

        <div id="wm-tile-panel">
          <div class="wm-field">
            <div class="wm-field-row">
              <label for="wm-gap-x">横向间距</label>
              <span id="wm-gap-x-val" class="wm-val">160px</span>
            </div>
            <input id="wm-gap-x" class="wm-range" type="range" min="30" max="420" step="5" value="160" />
          </div>
          <div class="wm-field">
            <div class="wm-field-row">
              <label for="wm-gap-y">纵向间距</label>
              <span id="wm-gap-y-val" class="wm-val">130px</span>
            </div>
            <input id="wm-gap-y" class="wm-range" type="range" min="30" max="420" step="5" value="130" />
          </div>
          <div class="wm-checks">
            <label><input type="checkbox" id="wm-stagger" checked /> 交错平铺（砖墙效果）</label>
          </div>
        </div>

        <div id="wm-single-panel" hidden>
          <div class="wm-field">
            <div class="wm-field-row"><span>九宫格定位（也可直接在图上拖动）</span></div>
            <div class="wm-grid9" role="group" aria-label="九宫格位置">
              <button type="button" data-wm-pos="tl" aria-pressed="false">左上</button>
              <button type="button" data-wm-pos="tc" aria-pressed="false">中上</button>
              <button type="button" data-wm-pos="tr" aria-pressed="false">右上</button>
              <button type="button" data-wm-pos="ml" aria-pressed="false">左中</button>
              <button type="button" data-wm-pos="mc" aria-pressed="false">居中</button>
              <button type="button" data-wm-pos="mr" aria-pressed="false">右中</button>
              <button type="button" data-wm-pos="bl" aria-pressed="false">左下</button>
              <button type="button" data-wm-pos="bc" aria-pressed="false">中下</button>
              <button type="button" data-wm-pos="br" aria-pressed="true">右下</button>
            </div>
          </div>
          <div class="wm-field">
            <div class="wm-field-row">
              <label for="wm-margin">边距</label>
              <span id="wm-margin-val" class="wm-val">28px</span>
            </div>
            <input id="wm-margin" class="wm-range" type="range" min="0" max="140" step="2" value="28" />
          </div>
        </div>

        <div class="wm-divider"></div>

        <div>
          <p class="wm-section-title">导出设置</p>
          <div class="wm-field">
            <div class="wm-field-row"><label for="wm-format">输出格式</label></div>
            <select id="wm-format" class="wm-select">
              <option value="auto">保持原格式</option>
              <option value="image/png">PNG（无损）</option>
              <option value="image/jpeg">JPEG（体积小）</option>
              <option value="image/webp">WebP（高压缩）</option>
            </select>
          </div>
          <div id="wm-quality-wrap" class="wm-field">
            <div class="wm-field-row">
              <label for="wm-quality">导出画质</label>
              <span id="wm-quality-val" class="wm-val">92%</span>
            </div>
            <input id="wm-quality" class="wm-range" type="range" min="40" max="100" step="1" value="92" />
          </div>
        </div>

        <div class="wm-privacy">
          <span data-icon="shield"></span>
          <span>全部图片仅在浏览器本地处理，不上传服务器。</span>
        </div>
      </aside>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav({
      title: '图片水印',
      showFileInput: false
    });
  </script>
  <script src="js/workspace.js"></script>
  <script src="js/image-watermark.js"></script>
  <script src="js/playful.js" defer></script>
</body>
</html>
