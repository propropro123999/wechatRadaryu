<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>文章一键排版 - ICviews Tools</title>
    <link rel="stylesheet" href="ui.css" />
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>

    <style>
        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        .back-link {
            color: var(--gem-color-text-secondary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--color-primary);
        }

        /* Editor Card & Layout */
        .editor-card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.05);
            overflow: hidden !important;
            /* Force hide overflow to let flex children handle it */
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            position: relative;
        }

        /* Top Actions Bar (Custom) */
        .actions-bar {
            padding: 12px 24px;
            background: #fafbfc;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            flex-shrink: 0;
        }

        /* Native Editor Styles */
        .native-editor {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #fff;
            padding: 24px;
            outline: none;
            line-height: 1.6;
            font-size: 16px;
            color: #333;
        }

        .native-editor img {
            max-width: 100%;
            height: auto;
        }

        .workspace-tool #editor-content.native-editor {
            box-sizing: border-box;
            width: 100%;
            max-width: 642px;
            min-width: 0;
            margin: 0 auto;
            overflow-wrap: break-word;
        }

        .native-editor svg { max-width: 100%; }

        #article-metadata {
            box-sizing: border-box;
            width: 100%;
            max-width: 642px;
            margin: 0 auto;
            padding: 16px 32px;
            border-bottom: 1px solid var(--color-border);
        }

        .article-metadata-row { display: flex; align-items: center; gap: 16px; }
        .article-metadata-row[hidden] { display: none; }
        .article-metadata-row + .article-metadata-row { margin-top: 12px; }
        .article-metadata-row > div { flex: 1; min-width: 0; }
        .article-metadata-row > div > span { color: var(--color-text-secondary); font-size: 12px; }
        .article-metadata-row p { margin: 4px 0 0; color: var(--color-text); overflow-wrap: anywhere; }
        .article-metadata-row button { flex-shrink: 0; }

        .native-editor p {
            margin-bottom: 1em;
            min-height: 1em;
        }

        /* Custom Styles for Checkbox & Inputs */
        .checkbox-group {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            color: var(--color-text-muted);
            font-weight: 500;
        }

        .checkbox-item input {
            margin-right: 6px;
            accent-color: var(--color-primary);
            width: 14px;
            height: 14px;
        }

        .action-btn {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 99px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.2);
            white-space: nowrap;
        }

        .action-btn:hover {
            background-color: #1557b0;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
            transform: translateY(-1px);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* Toast & Spinners */
        .status-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 2000;
        }

        .status-toast.show {
            opacity: 1;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 6px;
        }
    </style>
    <link rel="stylesheet" href="workspace.css" />
</head>

<body>
    <div id="nav-container"></div>

    <div class="main-container">
        <!-- Editor Card -->
        <div class="editor-card">

            <!-- 1. Actions Bar (Import & Format Settings) -->
            <div class="actions-bar">
                <!-- URL Import -->
                <div class="article-import-row" style="display: flex; gap: 8px; flex: 1;">
                    <input type="text" id="articleUrl" placeholder="粘贴微信公众号文章链接..."
                        style="flex-grow: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none;">
                    <button class="action-btn" onclick="importArticle()"><span data-icon="link"></span>导入</button>
                </div>

                <div class="toolbar-divider" aria-hidden="true"></div>

                <!-- Settings -->
                <div class="checkbox-group">
                    <label class="checkbox-item"><input id="clearSign" type="checkbox" checked>格式化(空格/引号)</label>
                    <label class="checkbox-item"><input id="clearAttr" type="checkbox" checked>清除样式</label>
                    <label class="checkbox-item"><input id="clearLink" type="checkbox" checked>清除链接</label>
                    <label class="checkbox-item"><input id="clearImg" type="checkbox">清除图片</label>
                </div>

                <!-- Main Actions -->
                <div class="editor-main-actions">
                <button class="action-btn"
                    style="background-color: white; color: #333; border: 1px solid #ddd; box-shadow:none;"
                    onclick="copyToClipboard()"><span data-icon="copy"></span> 复制结果</button>
                <button class="action-btn" onclick="formatText()"><span data-icon="sparkles"></span> 一键排版</button>
                </div>
            </div>

            <!-- Native Editor Content -->
            <section id="article-metadata" hidden aria-label="导入文章信息">
                <div class="article-metadata-row" id="article-title-row">
                    <div><span>文章标题</span><p id="article-title"></p></div>
                    <button type="button" class="action-btn" onclick="copyArticleMetadata('title')"><span data-icon="copy"></span>复制标题</button>
                </div>
                <div class="article-metadata-row" id="article-author-row">
                    <div><span>作者</span><p id="article-author"></p></div>
                    <button type="button" class="action-btn" onclick="copyArticleMetadata('author')"><span data-icon="copy"></span>复制作者</button>
                </div>
            </section>
            <div id="editor-content" class="native-editor" contenteditable="true" data-placeholder="粘贴文章内容，或使用上方导入链接…" aria-label="文章编辑区"></div>

        </div>
    </div>



    <div id="toast" class="status-toast">操作完成</div>

    <script src="js/article-import.js"></script>
    <script>
        // Native Editor Logic
        // No external dependencies needed for editor core


        // --- Core Functions ---

        function setArticleMetadata(article = {}) {
            for (const key of ['title', 'author']) {
                document.getElementById('article-' + key).textContent = article[key] || '';
                document.getElementById('article-' + key + '-row').hidden = !article[key];
            }
            document.getElementById('article-metadata').hidden = !article.title && !article.author;
        }

        async function copyArticleMetadata(key) {
            const value = document.getElementById('article-' + key)?.textContent;
            if (!value) return showToast('没有可复制的内容');
            try {
                await navigator.clipboard.writeText(value);
                showToast(key === 'title' ? '标题已复制' : '作者已复制');
            } catch {
                showToast('复制失败，请允许浏览器访问剪贴板后重试');
            }
        }

        const articleEditor = document.getElementById('editor-content');
        function clearReplacedArticleMetadata() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;
            const range = selection.getRangeAt(0);
            if (!range.intersectsNode(articleEditor)) return;
            const selected = range.cloneContents();
            if (selected.textContent.trim() === articleEditor.textContent.trim() &&
                selected.querySelectorAll('img, svg').length === articleEditor.querySelectorAll('img, svg').length) {
                setArticleMetadata();
            }
        }
        articleEditor.addEventListener('paste', clearReplacedArticleMetadata);
        articleEditor.addEventListener('beforeinput', clearReplacedArticleMetadata);
        articleEditor.addEventListener('input', () => {
            if (!articleEditor.textContent.trim() && !articleEditor.querySelector('img, svg')) setArticleMetadata();
        });

        async function importArticle() {
            let url;
            try { url = WeChatArticle.articleUrl($('#articleUrl').val().trim()); }
            catch (err) { return showToast(err.message); }

            const $btn = $('button[onclick="importArticle()"]');
            const originalHtml = $btn.html();
            $btn.html('<span class="spinner"></span> 导入中').prop('disabled', true);

            try {
                // Call Vercel API
                const resp = await fetch(`/api/fetch-article?url=${encodeURIComponent(url)}`);
                const json = await resp.json();

                if (!resp.ok) throw new Error(json.error || 'Fetch failed');
                if (!json.html) throw new Error('无内容');

                const article = WeChatArticle.extract(json.html, url);
                $('#editor-content').html(article.html).scrollTop(0);
                setArticleMetadata(article);
                showToast(`导入成功 (代理 ${article.images} 张图片)`);

            } catch (err) {
                console.error('Import Error:', err);
                showToast('导入失败: ' + err.message);
            } finally {
                $btn.html(originalHtml).prop('disabled', false);
            }
        }

        function formatText() {
            // Get Content
            const $editor = $('#editor-content');
            const rawHtml = $editor.html();
            if (!rawHtml || rawHtml === '<p><br></p>') return showToast('内容为空');

            // Virtual DOM processing
            const $temp = $('<div>').html(rawHtml);

            // 1. Remove Attributes (Styles/Classes)
            if ($('#clearAttr').is(':checked')) {
                $temp.find('*').each(function () {
                    const $el = $(this);

                    // Logic to keep some attrs (e.g. img src)
                    const keepImg = !$('#clearImg').is(':checked') && $el.is('img');
                    const keepLink = !$('#clearLink').is(':checked') && $el.is('a');
                    const keepSvg = this.namespaceURI === 'http://www.w3.org/2000/svg';

                    // Native attributes map
                    $.each([...this.attributes], function (i, attr) {
                        const name = attr.name;
                        if (keepImg && (name === 'src' || name === 'alt' || name === 'width' || name === 'height' || name === 'referrerpolicy')) return;
                        if (keepSvg && name === 'xlink:href' && /^#[\w:.-]+$/.test(attr.value)) return;
                        if (keepSvg && /^(viewBox|xmlns|d|points|x|y|dx|dy|x1|x2|y1|y2|cx|cy|r|rx|ry|width|height|fill|stroke|stroke-width|transform|href|id|clip-path|text-anchor|dominant-baseline|font-size|font-family|font-weight|font-style)$/.test(name)) return;
                        if (keepLink && (name === 'href' || name === 'target')) return;
                        $el.removeAttr(name);
                    });

                    // Re-add referrerpolicy for images if kept
                    if (keepImg) $el.attr('referrerpolicy', 'no-referrer');
                });
            }

            // 2. Remove Links
            if ($('#clearLink').is(':checked')) {
                $temp.find('a').each(function () { $(this).replaceWith($(this).html()); });
            }

            // 3. Remove Images
            if ($('#clearImg').is(':checked')) {
                $temp.find('img, svg').remove();
            }

            // 4. Text Spacing & Punctuation
            if ($('#clearSign').is(':checked')) {
                processTextNodes($temp[0]);
            }

            // Set back to editor
            $editor.html($temp.html());
            showToast('排版完成');
        }

        // Helper: Traverse and process text nodes only
        function processTextNodes(node) {
            if (node.nodeType === 3) { // Text Node
                let text = node.nodeValue;
                // Add Spaces
                text = text.replace(/([\u4E00-\u9FA3])([A-Za-z0-9\(\[\{@#])/g, '$1 $2');
                text = text.replace(/([A-Za-z0-9\.,!@#%?\)\]\}])([\u4E00-\u9FA3])/g, '$1 $2');
                // Punctuation
                text = text.replace(/([〔〕（）。，！？《》—“”「」]) +/g, '$1');
                text = text.replace(/ +([〔〕（）。，！？《》—“”「」])/g, '$1');
                text = text.replace(/“/g, "「").replace(/”/g, "」");

                node.nodeValue = text;
            } else if (node.nodeType === 1 && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE') {
                // Recursion
                for (let i = 0; i < node.childNodes.length; i++) {
                    processTextNodes(node.childNodes[i]);
                }
            }
        }

        function copyToClipboard() {
            const $content = document.getElementById('editor-content');
            const clipboard = WeChatArticle.clipboardContent($content);
            const copy = document.createElement('div');
            copy.innerHTML = clipboard.html;
            copy.style.cssText = 'position:fixed;left:-10000px;top:0;width:578px;';
            document.body.append(copy);

            const selection = window.getSelection();
            selection.removeAllRanges();
            const range = document.createRange();
            range.selectNodeContents(copy);
            selection.addRange(range);
            const writeClipboard = event => {
                event.clipboardData.setData('text/html', clipboard.html);
                event.clipboardData.setData('text/plain', clipboard.text);
                event.preventDefault();
            };
            document.addEventListener('copy', writeClipboard);

            try {
                if (!document.execCommand('copy')) throw new Error('copy failed');
                showToast('已复制 (保留格式)');
            } catch (e) {
                showToast('复制失败');
            } finally {
                document.removeEventListener('copy', writeClipboard);
                selection.removeAllRanges();
                copy.remove();
            }
        }

        function showToast(msg) {
            const $toast = $('#toast');
            $toast.text(msg).addClass('show');
            setTimeout(() => $toast.removeClass('show'), 2000);
        }

    </script>

    <script src="js/utils.js"></script>
    <script src="js/nav.js"></script>
    <script>
      renderNav({
        title: '文章排版',
        icon: 'edit'
      });
    </script>
    <script src="js/workspace.js"></script>
</body>

</html>
